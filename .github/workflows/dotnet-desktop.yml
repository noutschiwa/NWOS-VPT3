name: .NET Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore solution
      run: dotnet restore NWOS.sln

    - name: Build solution
      run: dotnet build NWOS.sln --no-restore --configuration ${{ matrix.configuration }}

    - name: Run tests
      run: dotnet test NWOS.sln --no-build --no-restore --configuration ${{ matrix.configuration }}
